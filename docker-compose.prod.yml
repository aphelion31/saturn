services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saturn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-saturn}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saturn} -d ${POSTGRES_DB:-saturn}"]
      interval: 5s
      timeout: 5s
      retries: 10

  saturn:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-saturn}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-saturn}
      BIND: 0.0.0.0:3000
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      WEB_DIR: /srv/saturn/web
      STORAGE_DIR: /data/storage
      TRUST_PROXY: ${TRUST_PROXY:-1}
      SATURN_JOBS: ${SATURN_JOBS:-1}
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      DB_POOL: ${DB_POOL:-20}
      RUST_LOG: ${RUST_LOG:-info,tower_http=warn}
    volumes:
      - saturn_storage:/data/storage
    stop_grace_period: 30s

volumes:
  pgdata:
  saturn_storage:
