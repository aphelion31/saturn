# ref: https://github.com/amannn/action-semantic-pull-request
# PR titles must follow Conventional Commits, and work branches must be
# STN-<number>/<type>-<description> (docs/github/02.GIT-BRANCH.md).
name: "Lint PR"

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  branch:
    name: Validate branch name
    runs-on: ubuntu-latest
    steps:
      - name: Check head branch
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          types='feat|fix|refactor|perf|docs|test|build|ci|chore|core|style|revert'
          if [[ "$BRANCH" =~ ^(release|hotfix)/[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || [[ "$BRANCH" =~ ^(develop|master)$ ]] \
            || [[ "$BRANCH" =~ ^STN-[0-9]{3,}/($types)-[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "ok: $BRANCH"
          else
            echo "::error::Branch '$BRANCH' must be STN-<number>/<type>-<description>, e.g. STN-001/feat-boilerplate"
            exit 1
          fi
