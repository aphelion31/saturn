name: Update weekly stars chart

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-star-history
  cancel-in-progress: true

jobs:
  update:
    if: github.repository == 'aphelion31/saturn'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate chart using repository-authorized star data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/generate-star-history.mjs --repo "${{ github.repository }}" --output docs/images/star-history.svg
      - name: Commit updated chart
        run: |
          if git diff --quiet -- docs/images/star-history.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/star-history.svg
          git commit -m "docs: update weekly stars chart"
          git pull --rebase
          git push
