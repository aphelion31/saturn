[package]
name = "saturn"
version = "1.0.0"
edition = "2024"
description = "Saturn: lightweight Rust rewrite of the Plane backend, serving the Plane React Router apps"
license = "AGPL-3.0-only"

[dependencies]
ammonia = "4"
anyhow = "1"
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
fernet = { version = "0.2", default-features = false, features = ["rustcrypto"] }
flate2 = "1"
futures = "0.3"
hex = "0.4"
html5ever = "0.40"
hmac = "0.12"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "tokio1", "tokio1-rustls-tls", "hostname"] }
argon2 = "0.5"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "json", "uuid"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace", "set-header", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
yrs = "0.24"
chrono-tz = "0.10"
zxcvbn = "3"
rust_xlsxwriter = "0.104"
pdf-writer = "0.15"

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
